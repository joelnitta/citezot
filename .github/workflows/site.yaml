# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Only rebuild the site when something it is built from changes. Manual runs
# (workflow_dispatch) and releases always build.
on:
  push:
    branches: [main, master]
    paths:
      - R/**
      - man/**
      - index.qmd
      - index.ja.qmd
      - articles/**
      - _quarto*.yml
      - _reference-template.qmd
      - dev/build-site.R
      - DESCRIPTION
      - .github/workflows/site.yaml
  pull_request:
    paths:
      - R/**
      - man/**
      - index.qmd
      - index.ja.qmd
      - articles/**
      - _quarto*.yml
      - _reference-template.qmd
      - dev/build-site.R
      - DESCRIPTION
      - .github/workflows/site.yaml
  release:
    types: [published]
  workflow_dispatch:

name: site.yaml

permissions: read-all

jobs:
  site:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: site-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: website

      - name: Build site
        run: source("dev/build-site.R")
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: _site
