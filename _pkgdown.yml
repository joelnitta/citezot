url: https://joelnitta.github.io/citezot/

template:
  bootstrap: 5

articles:
  - title: Guides
    navbar: ~
    contents:
      - setup

reference:
  - title: Build a bibliography
    desc: >
      Write a bibliography file containing only the references cited in your
      Quarto or R Markdown documents.
    contents:
      - cz_update_bib
      - cz_qmd_keys
      - cz_bare_keys
  - title: Connect to Zotero
    desc: Credentials, downloading your library, and the local cache.
    contents:
      - cz_auth
      - cz_fetch_items
      - cz_clear_cache
  - title: Find, add and edit items
    desc: Every function that changes your library is a dry run by default.
    contents:
      - cz_find
      - cz_get_item
      - cz_add
      - cz_update_item
      - cz_pin_key
  - title: Citekeys
    desc: Read pinned citekeys, and generate new ones from a formula.
    contents:
      - cz_item_key
      - cz_suggest_key
      - cz_key_format
